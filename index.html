<!DOCTYPE html>
<html>
<head>
    <title>My Styled Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            margin: 0;
            padding: 50px 20px;
            color: #333;
            min-height: 100vh;
        }

        .card {
            background-color: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* Styling for the image */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            margin-top: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

        /* Button design */
        .btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="My.jpg" alt="Profile Picture" class="profile-img">
        
        <h1>Hello, World!</h1>
        <p>Welcome to my very first website. I am learning how to code and style pages using HTML and CSS!</p>
        
        <a href="#" class="btn">Click Me</a>
    </div>

</body>
</html>
